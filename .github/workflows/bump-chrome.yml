name: Bump Google Chrome

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-chrome
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Chrome version
        id: fetch
        run: ./scripts/fetch-chrome-version >> "$GITHUB_OUTPUT"

      - name: Bump cask
        run: ./scripts/bump-chrome-cask "${{ steps.fetch.outputs.VERSION }}" "${{ steps.fetch.outputs.SHA256 }}"

      - name: Create or update bump PR
        id: cpr
        uses: peter-evans/create-pull-request@6b2f0f9b6f2f4f0d5b1f4f9e6e3d7d6b0c4e5a21 # v7
        with:
          token: ${{ github.token }}
          commit-message: "chore(chrome): bump to ${{ steps.fetch.outputs.VERSION }}"
          title: "chore(chrome): bump to ${{ steps.fetch.outputs.VERSION }}"
          body: |
            Automated version bump for Google Chrome ${{ steps.fetch.outputs.VERSION }}.
          branch: auto/chrome
          delete-branch: true
          add-paths: |
            Casks/google-chrome-linux.rb

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}
